<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#033B46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeavrNet">
<title>WeavrNet</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="global-notice" id="globalNotice" hidden></div>

<!-- Sign in / first-run setup -->
<div id="auth" hidden>
  <div class="logo-mark">W</div>
  <div class="logo-text">weavrnet</div>
  <div class="auth-sub" id="authSub">Sign in to control your Weavr devices from anywhere.</div>
  <form class="auth-form" id="authForm" autocomplete="on">
    <input class="input" id="authPassword" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <input class="input" id="authConfirm" type="password" placeholder="Confirm password" autocomplete="new-password" hidden>
    <button class="btn block" id="authSubmit" type="submit">Sign in</button>
    <div class="form-error" id="authError"></div>
    <button class="link-btn" id="forgotBtn" type="button">Forgot password?</button>
  </form>
  <form class="auth-form" id="resetForm" autocomplete="off" hidden>
    <div class="auth-help">A one-time code has been written to the WeavrNet container's log. On your server run
      <code>docker logs --tail 5 weavrnet</code> (use your container's name) and enter the code below.</div>
    <input class="input" id="resetCode" inputmode="numeric" placeholder="Code, e.g. 1234-5678" required>
    <input class="input" id="resetPassword" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" required>
    <input class="input" id="resetConfirm" type="password" placeholder="Confirm new password" autocomplete="new-password" required>
    <button class="btn block" id="resetSubmit" type="submit">Set new password</button>
    <div class="form-error" id="resetError"></div>
    <button class="link-btn" id="resetBack" type="button">Back to sign in</button>
  </form>
  <div class="auth-waiting" id="authWaiting" hidden>
    <div class="scanning"><div class="pulse"></div><span id="authWaitingText"></span></div>
  </div>
</div>

<!-- Main app -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-head">
      <div class="logo-mark sm">W</div>
      <div class="server-name">
        <div class="name" id="serverName">WeavrNet</div>
        <div class="meta"><span class="conn-dot connecting" id="relayDot"></span><span id="relayStatus">Connecting…</span></div>
      </div>
      <button class="icon-btn" data-action="open-server" title="Server settings" aria-label="Server settings">⚙</button>
    </div>
    <div class="side-body" id="deviceList"></div>
  </aside>

  <main id="detail">
    <div class="empty-detail" id="emptyDetail">
      <div style="font-size:44px;opacity:.4">📺</div>
      <div>Select a device to control it</div>
    </div>
    <div class="detail-inner" id="dashboard" hidden></div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
